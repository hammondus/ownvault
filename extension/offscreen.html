<!doctype html>
<!-- The extension's vault process: an offscreen document that stays alive so
     the unlocked (non-extractable) vault key can live in its memory. Loads
     the SAME crypto/storage/sync modules the PWA runs — vault.js, totp.js,
     sync.js are copied unmodified from web/js/ by `make extension`. -->
<html>
  <head><meta charset="utf-8"></head>
  <body>
    <script src="shared/argon2.min.js"></script>
    <script src="shared/vault.js"></script>
    <script src="shared/totp.js"></script>
    <script src="shared/sync.js"></script>
    <script src="offscreen.js"></script>
  </body>
</html>
