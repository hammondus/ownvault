<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Own Vault">
  <defs>
    <linearGradient id="ovBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cf62"/>
      <stop offset="1" stop-color="#e0a026"/>
    </linearGradient>
    <linearGradient id="ovShackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e0ea"/>
      <stop offset="1" stop-color="#8b9bb0"/>
    </linearGradient>
  </defs>
  <!-- Shackle (steel) -->
