# The Own Vault website. Separate from the vault server's compose file at the
# repository root, because it is a separate module with a separate release
# cadence — a copy edit here must never restart a container people are syncing
# vaults through.
#
#   make deploy       # pull, build, restart, smoke-test
#
# Nginx Proxy Manager terminates TLS and proxies to `ovsite:8090` on the
# shared `blobbyboo` network. No published ports: NPM is the only way in.
#
# This file only runs an image; it does not build one. `make docker-build`
# tags `ovsite:<git-sha>` and OVSITE_TAG in .env selects which tag runs, so a
# restart on the box can never silently recompile.
#
# .env beside this file (see .env.example) supplies the SMTP credentials and
# the destination address. It is git-ignored.
#
# The project name is pinned rather than left to default to the directory
# basename. Compose groups containers by project label, so two unrelated stacks
# checked out into directories of the same name become one project, and each
# reports the other's containers as orphans. Compose then suggests
# `--remove-orphans`, which would delete a container belonging to a different
# application. Pinning the name also survives renaming the clone directory.

name: ovsite

services:
  ovsite:
    image: "ovsite:${OVSITE_TAG:?set OVSITE_TAG in .env — run 'make deploy'}"
    container_name: ovsite
    restart: unless-stopped
    networks:
      - blobbyboo
    environment:
      # Where contact form mail goes. Without it the site still serves, and
      # the form says so rather than silently dropping messages.
      OWNVAULT_SITE_CONTACT_TO: "${OWNVAULT_SITE_CONTACT_TO:?set OWNVAULT_SITE_CONTACT_TO in .env}"
      # SMTP. Unset HOST means the server logs messages instead of sending
      # them, which is the right behaviour locally and the wrong one here.
      OWNVAULT_SITE_SMTP_HOST: "${OWNVAULT_SITE_SMTP_HOST:?set OWNVAULT_SITE_SMTP_HOST in .env}"
      OWNVAULT_SITE_SMTP_PORT: "${OWNVAULT_SITE_SMTP_PORT:-587}"
      OWNVAULT_SITE_SMTP_USERNAME: "${OWNVAULT_SITE_SMTP_USERNAME:-}"
      OWNVAULT_SITE_SMTP_PASSWORD: "${OWNVAULT_SITE_SMTP_PASSWORD:-}"
      OWNVAULT_SITE_SMTP_FROM: "${OWNVAULT_SITE_SMTP_FROM:?set OWNVAULT_SITE_SMTP_FROM in .env — must be an identity your SMTP provider has verified}"
      # The demo vault server this site links to. Blank (the default) hides
      # every link to it, so the site is correct on a deployment that runs no
      # demo — which is why this is `:-` and not `:?`.
      OWNVAULT_SITE_DEMO_URL: "${OWNVAULT_SITE_DEMO_URL:-}"
    # -baseurl fills the canonical and og: tags. -trusted-proxies defaults to
    # "private", which covers NPM on this Docker network, so the client IP is
    # read from the X-Forwarded-For that NPM sets rather than being the proxy's
    # own address. Narrow it to NPM's exact address if this network ever grows
    # containers that are not proxies.
    command: ["-addr", ":8090", "-baseurl", "${OVSITE_URL:-}"]

networks:
  blobbyboo:
    external: true
