<section class="screen" id="passwords-screen">
  <div class="pw-toolbar">
    <input id="pw-search" class="pw-search" type="search"
           placeholder="Search passwords…" autocomplete="off" spellcheck="false">
    <button id="pw-add" class="pw-add" type="button" aria-label="Add password">+</button>
  </div>
  <ul id="pw-list" class="pw-list" aria-label="Password entries"></ul>
  <p id="pw-empty" class="pw-empty" hidden></p>
</section>
